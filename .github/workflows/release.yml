# Builds the Windows installer + portable .exe and attaches them to a draft
# GitHub Release whenever a version tag is pushed:
#
#   npm version patch        # bumps package.json and creates the tag (e.g. v0.1.1)
#   git push --follow-tags
#
# Then open the draft on GitHub, write the notes and click "Publish release".
# Installed copies pick up the update automatically once it is published.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json ($version)."
            exit 1
          fi

      - run: npm ci

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
