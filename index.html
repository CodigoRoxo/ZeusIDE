<!doctype html>
<html lang="pt-BR" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeus IDE</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <style>
      #zeus-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #161922;
        color: #f1f3f7;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #zeus-splash.splash-light {
        background-color: #edf0f4;
        color: #111620;
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 320px;
        padding: 24px;
      }
      .splash-logo {
        width: 62px;
        height: 62px;
        border-radius: 16px;
        background: #1b1e2a;
        border: 1px solid #2e3447;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(168, 85, 247, 0.16);
        margin-bottom: 16px;
        animation: splash-pulse 2s infinite ease-in-out;
      }
      #zeus-splash.splash-light .splash-logo {
        background: #f7f9fa;
        border-color: #d0d5dd;
        box-shadow: 0 8px 24px rgba(147, 51, 234, 0.12);
      }
      .splash-z {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #c084fc, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
      }
      .splash-phrase {
        font-size: 12px;
        color: #788299;
        height: 20px;
        margin-bottom: 16px;
        transition: opacity 0.15s ease, transform 0.15s ease;
        opacity: 1;
        transform: translateY(0);
      }
      #zeus-splash.splash-light .splash-phrase {
        color: #5c667a;
      }
      .splash-phrase.phrase-changing {
        opacity: 0;
        transform: translateY(-4px);
      }
      .splash-bar-container {
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      #zeus-splash.splash-light .splash-bar-container {
        background: rgba(0, 0, 0, 0.08);
      }
      .splash-bar {
        height: 100%;
        width: 20%;
        background: linear-gradient(90deg, #a855f7, #ec4899);
        border-radius: 999px;
        transition: width 0.35s ease-out;
        box-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
    </style>
  </head>
  <body class="h-full bg-zeus-bg text-zeus-text select-none overflow-hidden font-sans">
    <!-- Zeus Preloader Splash Screen -->
    <div id="zeus-splash">
      <div class="splash-card">
        <div class="splash-logo">
          <img src="./brand-logo.png" alt="Zeus IDE Logo" style="width: 42px; height: 42px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(168,85,247,0.3));" />
        </div>
        <div class="splash-title">Zeus IDE</div>
        <div class="splash-phrase" id="splash-phrase">Carregando módulos...</div>
        <div class="splash-bar-container">
          <div class="splash-bar" id="splash-bar"></div>
        </div>
      </div>
    </div>

    <script src="./splash.js"></script>

    <div id="root" class="h-full w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
